name: ARM64 draft review build

on:
  push:
    branches: [arm64-build-review]
    paths:
      - '.github/workflows/arm64-review-build.yml'
      - 'OpenTS-ARM64-16x9-touch-controls.patch'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the updated source and package layout
        run: |
          set -euo pipefail
          mkdir -p build-source dist/opentsa/data
          tar -xzf OpenTS-ARM-source.tar.gz --strip-components=1 -C build-source
          patch -d build-source -p1 < OpenTS-ARM64-16x9-touch-controls.patch
          cp build-source/platform/portmaster/OpenTS-A.sh dist/
          cp build-source/LICENSE.md build-source/THIRD_PARTY_NOTICES.md \
            build-source/platform/portmaster/README.md dist/opentsa/

      - name: Compile the ARM64 game and check startup handling
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo debian:bookworm bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              ca-certificates curl cmake git gnupg lsb-release libsdl2-dev ninja-build pkg-config
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-18 main" > /etc/apt/sources.list.d/llvm.list
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang-18
            cmake -S /repo/build-source -B /repo/build -G Ninja \
              -DOPENTS_PORTMASTER=ON \
              -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build /repo/build --target OpenTS --parallel 2
            install -m 755 /repo/build/bin/Game /repo/dist/opentsa/Game
            if /repo/dist/opentsa/Game -DATADIR=/tmp/opents-missing-data > /tmp/startup.log 2>&1; then
              cat /tmp/startup.log
              exit 1
            fi
            grep -F "The data directory cannot be used" /tmp/startup.log
          '
          readelf -h -l -d --version-info dist/opentsa/Game
          (cd dist && zip -r ../OpenTS-ARM64-Widescreen-Touch-Update.zip OpenTS-A.sh opentsa)
          tar -czf OpenTS-ARM-source-16x9-touch-controls.tar.gz -C build-source .
          cp OpenTS-ARM64-16x9-touch-controls.patch OpenTS-ARM64-README.md .

      - name: Keep a build artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: OpenTS-ARM64-Widescreen-Touch-Update
          path: OpenTS-ARM64-Widescreen-Touch-Update.zip
          if-no-files-found: error

      - name: Attach the corrected package and source to the GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.draft == true and .name == "OpenTS-ARM64 — Widescreen and Controls Update") | .id' | head -n 1)
          if [ -z "$release_id" ]; then
            echo 'The expected review draft was not found; keeping the build as an Actions artifact.'
            exit 1
          fi
          for asset_name in OpenTS-ARM64-Widescreen-Touch-Update.zip OpenTS-ARM-source-16x9-touch-controls.tar.gz OpenTS-ARM64-16x9-touch-controls.patch OpenTS-ARM64-README.md; do
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
              --jq ".[] | select(.name == \"${asset_name}\") | .id" | while read -r asset_id; do
                [ -z "$asset_id" ] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
              done
          done
          body=$(cat <<'BODY'
          Draft for review — not public. The previous R36S test returned to the Ports menu because the new launcher and package used opents-a, while the established install folder is opentsa (without a hyphen). This corrected ARM64 build uses the existing opentsa/data path. The attached device log reported glibc 2.30; it did not show a runtime-library failure. The corrected build still needs to be retested on an R36S before publication.

          This update addresses the RP6 display and touchscreen feedback:
          - The game chooses a widescreen battlefield width for the device display while retaining its 480-pixel logical height.
          - Touch taps and drags are mapped into game coordinates.
          - “Place Ready Building” is assignable in Options > Controls.
          - The Controls menu layout and ARM64 README are updated.

          The corrected ARM64 ZIP, source snapshot, patch, and README are attached for review. This remains an unpublished draft.
          BODY
          )
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f body="$body" >/dev/null
          for asset in OpenTS-ARM64-Widescreen-Touch-Update.zip OpenTS-ARM-source-16x9-touch-controls.tar.gz OpenTS-ARM64-16x9-touch-controls.patch OpenTS-ARM64-README.md; do
            curl --fail-with-body --silent --show-error --location --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary @"${asset}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset}"
          done
