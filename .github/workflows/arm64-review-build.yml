name: ARM64 draft review build

on:
  push:
    branches: [arm64-build-review]
    paths:
      - '.github/workflows/arm64-review-build.yml'
      - 'OpenTS-ARM64-16x9-touch-controls.patch'
      - 'OpenTS-ARM64-auto-display.patch'
      - 'OpenTS-ARM64-README.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the updated source and package layout
        run: |
          set -euo pipefail
          mkdir -p build-source dist/opentsa/data dist/opentsa/lib
          tar -xzf OpenTS-ARM-source.tar.gz --strip-components=1 -C build-source
          patch -d build-source -p1 < OpenTS-ARM64-16x9-touch-controls.patch
          patch -d build-source -p1 < OpenTS-ARM64-auto-display.patch
          cp build-source/platform/portmaster/OpenTS-A.sh dist/
          cp build-source/LICENSE.md build-source/THIRD_PARTY_NOTICES.md \
            build-source/platform/portmaster/README.md dist/opentsa/

      - name: Compile for the R36S glibc baseline and check startup handling
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo debian:buster bash -euc '
            printf "%s\n" "deb [check-valid-until=no] http://archive.debian.org/debian buster main" "deb [check-valid-until=no] http://archive.debian.org/debian-security buster/updates main" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              ca-certificates curl gnupg python3-pip libsdl2-dev ninja-build pkg-config
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/buster/ llvm-toolchain-buster-18 main" > /etc/apt/sources.list.d/llvm.list
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang-18 libc++-18-dev libc++abi-18-dev libunwind-18-dev
            curl -fsSL https://cmake.org/files/v3.31/cmake-3.31.12-linux-aarch64.tar.gz -o /tmp/cmake.tar.gz
            mkdir -p /opt/cmake
            tar -xzf /tmp/cmake.tar.gz --strip-components=1 -C /opt/cmake
            export PATH="/opt/cmake/bin:$PATH"
            cmake -S /repo/build-source -B /repo/build -G Ninja \
              -DOPENTS_PORTMASTER=ON \
              -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
              -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build /repo/build --target OpenTS --parallel 4
            install -m 755 /repo/build/bin/Game /repo/dist/opentsa/Game
            for library in libc++.so.1 libc++abi.so.1 libunwind.so.1; do
              library_path=$(find /usr/lib/llvm-18/lib /usr/lib/aarch64-linux-gnu /lib/aarch64-linux-gnu \
                -name "$library" -print -quit 2>/dev/null || true)
              if [ -z "$library_path" ]; then
                library_path=$(ldconfig -p | awk -v name="$library" "\$1 == name { print \$NF; exit }")
              fi
              if [ -n "$library_path" ]; then
                cp -L "$library_path" "/repo/dist/opentsa/lib/$library"
              elif [ "$library" != libunwind.so.1 ]; then
                echo "Required LLVM runtime library not found: $library" >&2
                ldconfig -p | grep -E "libc\+\+|libunwind" || true
                find /usr/lib/llvm-18/lib /usr/lib/aarch64-linux-gnu -maxdepth 2 \
                  \( -name "libc++*" -o -name "libunwind*" \) -print 2>/dev/null || true
                exit 1
              fi
            done
            : > /repo/dist/opentsa/lib/LLVM-RUNTIME-LICENSES.txt
            for license in /usr/share/doc/libc++1-18/copyright /usr/share/doc/libc++abi1-18/copyright /usr/share/doc/libunwind-18/copyright; do
              if [ -r "$license" ]; then cat "$license" >> /repo/dist/opentsa/lib/LLVM-RUNTIME-LICENSES.txt; printf "\n" >> /repo/dist/opentsa/lib/LLVM-RUNTIME-LICENSES.txt; fi
            done
            set +e
            LD_LIBRARY_PATH=/repo/dist/opentsa/lib SDL_VIDEODRIVER=dummy timeout 10 \
              /repo/dist/opentsa/Game -DATADIR=/tmp/opents-missing-data > /tmp/startup.log 2>&1
            startup_status=$?
            set -e
            cat /tmp/startup.log
            if grep -E "error while loading shared libraries|GLIBC_[0-9.]+ not found|symbol lookup error" /tmp/startup.log; then
              exit 1
            fi
            if [ "$startup_status" -eq 127 ]; then
              echo "The ARM64 executable could not be launched." >&2
              exit 1
            fi
          '
          readelf -h -l -d --version-info dist/opentsa/Game
          max_glibc=$(readelf --version-info dist/opentsa/Game | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1)
          test "$(printf '%s\n' "$max_glibc" GLIBC_2.30 | sort -V | tail -n 1)" = GLIBC_2.30
          (cd dist && zip -r ../OpenTS-ARM64-Adaptive-Display-v0.2.1.zip OpenTS-A.sh opentsa)
          tar -czf OpenTS-ARM-source-16x9-touch-controls.tar.gz -C build-source .

      - name: Keep a build artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: OpenTS-ARM64-Widescreen-Touch-Update
          path: OpenTS-ARM64-Adaptive-Display-v0.2.1.zip
          if-no-files-found: error

      - name: Create the v0.2.1 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="OpenTS-ARM64 — Adaptive Display Update"
          notes_file=$(mktemp)
          cat > "$notes_file" <<'BODY'
          OpenTS-ARM64 is an ARM64 Linux handheld build of OpenTS-A for Command & Conquer: Tiberian Sun and Firestorm. This release updates full-screen sizing for handheld displays. Game data is not included.

          ## Device support
          The build targets ARM64 PortMaster-compatible Linux handhelds. Confirmed tested on an R36S Clone running ArkOS4Clone-20261008; other device and firmware combinations are not yet individually verified.

          ## Display and controls
          - Detects the display drawable size at launch and requests fullscreen, with a borderless display-size fallback for SDL backends that leave the window at 640×480.
          - Adapts the game frame width to widescreen aspect ratios and scales the frame to the available display while preserving proportions. Very tall or portrait screens may show bars.
          - Keeps controller button assignments, cursor speed, touchscreen taps and drags, cursor animation, and zoom-aligned selection.
          - “Place Ready Building” can be assigned in Options > Controls.

          ## Fresh install
          1. Extract the ZIP into the handheld’s `ports/` folder. Keep `OpenTS-A.sh` beside `opentsa/`.
          2. Copy the contents of your Command & Conquer: Tiberian Sun and Firestorm install folder into `ports/opentsa/data/`.
          3. Refresh the Ports list and launch OpenTS-A.

          The game folder should contain: `TIBSUN.MIX`, `GMENU.MIX`, `EXPAND01.MIX`, `EXPAND02.MIX`, `EXPAND03.MIX`, `E01SCD01.MIX`, `E01SCD02.MIX`, `MAPS01.MIX`, `MAPS02.MIX`, `maps03.mix`, `MOVIES01.MIX`, `MOVIES02.MIX`, `movies03.mix`, `MULTI.MIX`, `PATCH.MIX`, `SCORES.MIX`, `SCORES01.MIX`, `sidecd01.mix`, `sidecd02.mix`, `wdt.mix`, and `wdtvox.mix`. Copy the files themselves, not their parent folder. Game data is not included.

          ## Updating an existing installation
          1. Close the game and back up your existing `ports/opentsa/` folder, including saves and settings.
          2. Extract the new ZIP into the existing `ports/` folder and replace the older launcher and engine files.
          3. Keep the existing `opentsa/data/` folder and save/settings files. Do not delete the existing `opentsa/` folder first; if asked about existing game data or saves, keep those copies.
          4. Launch the game and confirm your saves are present. You do not need to recopy game data.

          ## Assets
          - `OpenTS-ARM64-Adaptive-Display-v0.2.1.zip`: installable build.
          - `OpenTS-ARM-source-16x9-touch-controls.tar.gz`: source snapshot.
          - `OpenTS-ARM64-16x9-touch-controls.patch` and `OpenTS-ARM64-auto-display.patch`: source changes.
          - `OpenTS-ARM64-README.md`: setup reference.

          OpenTS-A is based on the OpenTS engine. Tiberian Sun and Firestorm data are not included and remain the property of their rights holders. This is an unofficial community build, not affiliated with or endorsed by Electronic Arts. See the included licence and third-party notices.
          BODY

          if gh release view v0.2.1 >/dev/null 2>&1; then
            existing_asset=$(gh release view v0.2.1 --json assets --jq '.assets[].name' | grep -Fx 'OpenTS-ARM64-Widescreen-Touch-Update.zip' || true)
            if [ -n "$existing_asset" ]; then
              gh release delete-asset v0.2.1 "$existing_asset" --yes
            fi
            gh release upload v0.2.1 \
              OpenTS-ARM64-Adaptive-Display-v0.2.1.zip \
              OpenTS-ARM-source-16x9-touch-controls.tar.gz \
              OpenTS-ARM64-16x9-touch-controls.patch \
              OpenTS-ARM64-auto-display.patch \
              OpenTS-ARM64-README.md \
              --clobber
            gh release edit v0.2.1 --title "$title" --notes-file "$notes_file"
          else
            gh release create v0.2.1 \
              OpenTS-ARM64-Adaptive-Display-v0.2.1.zip \
              OpenTS-ARM-source-16x9-touch-controls.tar.gz \
              OpenTS-ARM64-16x9-touch-controls.patch \
              OpenTS-ARM64-auto-display.patch \
              OpenTS-ARM64-README.md \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "$title" \
              --notes-file "$notes_file"
          fi
